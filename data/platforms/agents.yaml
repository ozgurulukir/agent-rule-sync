# Shared Agents Platform Format Profile
# LLM Reference: describes what shared agent skills expect.
# Same as OpenCode (directory-based, user-scoped).
# NOT enforced by build system — informational for translator authoring.

rules:
  format: markdown
  heading_style: atx
  bullet_style: dash
  code_block: fenced
  frontmatter: strip
  note: "Project: .agents/rules/*.md, User: ~/.agents/rules/*.md"

skills:
  format: directory  # SKILL.md inside named subdirectories
  content_type: markdown
  frontmatter: strip
  content:
    - "# Skill Name"
    - "## Overview"
    - "## Capabilities"
    - "## Usage"
  bullet_style: dash
  code_block: fenced
  note: "Project: .agents/skills/*/SKILL.md, User: ~/.agents/skills/*/SKILL.md"

notes: |
  Shared agent skills at ~/.agents/skills/ and rules at ~/.agents/rules/.
  Follows the emerging ~/.agents/ standard (crush, goose, opencode, agentskills.io).
  Used by ast-grep, line-repetition-control, vibe-security, workstation-rules.
  Same format as OpenCode but under agents/ namespace.
