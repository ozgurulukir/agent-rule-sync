# Qwen Code Platform Format Profile
# LLM Reference: describes what Qwen Code expects for imports.
# NOT enforced by build system — informational for translator authoring.

rules:
  format: single_file
  content_type: markdown
  file_name: "QWEN.md"
  frontmatter: strip
  heading_style: atx
  bullet_style: dash
  note: "Global: ~/.qwen/QWEN.md, Project: .qwen/QWEN.md. Qwen Code uses QWEN.md, not @import directives."

skills:
  format: directory
  content_type: markdown
  frontmatter: strip
  heading_style: atx
  bullet_style: dash
  note: "User: ~/.qwen/skills/*/SKILL.md, Project: .qwen/skills/*/SKILL.md. Standard Agent Skills directories."

notes: |
  Qwen Code uses QWEN.md for rules (global ~/.qwen/QWEN.md or project .qwen/QWEN.md).
  Configuration is in settings.json (~/.qwen/settings.json or .qwen/settings.json).
  QWEN_HOME env var overrides the default ~/.qwen directory.
  Skills are standard SKILL.md directories, not @import directives.
