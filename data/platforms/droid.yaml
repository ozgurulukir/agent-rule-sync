# Droid Platform Format Profile
# LLM Reference: describes what Droid expects for skills.
# NOT enforced by build system — informational for translator authoring.

rules:
  format: file
  file_name: "AGENTS.md"
  note: "Rules go to AGENTS.md (project root or ~/.factory/AGENTS.md personal override)"

skills:
  format: directory
  content_type: markdown
  frontmatter: strip
  bullet_style: dash
  code_block: fenced
  note: "Workspace: .factory/skills/*/SKILL.md, Personal: ~/.factory/skills/*/SKILL.md"

notes: |
  Droid reads AGENTS.md hierarchy: project root → parent dirs → ~/.factory/AGENTS.md.
  Skills are directory-based SKILL.md files, not a single droid.md.
  Custom Droids (subagents) live in .factory/droids/*.md.
