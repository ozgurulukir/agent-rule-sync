# Goose Platform Format Profile
# LLM Reference: describes what Goose expects for skills.
# NOT enforced by build system — informational for translator authoring.

rules:
  format: none                  # Goose has no separate rules file
  note: "All content is embedded in skills; Goose uses AGENTS.md for project context"

skills:
  format: directory
  content_type: markdown
  frontmatter: strip
  bullet_style: dash
  code_block: fenced
  emoji_policy: strip
  code_highlight: keep
  note: "User: ~/.agents/skills/*/SKILL.md, Project: .agents/skills/*/SKILL.md. Legacy: ~/.claude/skills/*/SKILL.md. No single goose.md."
