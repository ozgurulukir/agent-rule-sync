# Oh My Pi Platform Format Profile
# LLM Reference: describes what Oh My Pi expects for rules and skills.
# Same as OpenCode (directory-based, user-scoped).
# NOT enforced by build system — informational.

rules:
  format: markdown
  heading_style: atx
  bullet_style: dash
  code_block: fenced
  frontmatter: strip
  note: "Oh My Pi discovers AGENTS.md and rule files from ~/.omp/agent/ and project root"

skills:
  format: directory
  content_type: markdown
  frontmatter: strip
  bullet_style: dash
  code_block: fenced
  note: "Native: ~/.omp/agent/skills/*/SKILL.md, Agents: ~/.agents/skills/*/SKILL.md, Project: .agents/skills/*/SKILL.md"

notes: |
  Oh My Pi reads rules from AGENTS.md and ~/.omp/agent/ configuration.
  Skills are discovered from ~/.omp/agent/skills/, ~/.agents/skills/, and .agents/skills/.
  Config: ~/.omp/agent/config.yml, models: ~/.omp/agent/models.yml
  Base path is ~/.omp/agent/ (NOT ~/.config/oh-my-pi/).
